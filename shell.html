<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aroma WebAssembly Runtime</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #e0e0e0; }
    body { display: flex; gap: 20px; padding: 20px; }

    #editor-panel {
      flex: 0 0 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #example-selector {
      padding: 8px 12px;
      font-size: 13px;
      background: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      cursor: pointer;
    }

    #example-selector:focus {
      outline: none;
      border-color: #5c6ac4;
    }

    #code-editor {
      flex: 1;
      width: 100%;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      background: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      resize: none;
      line-height: 1.5;
    }

    #run-button {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      background: #5c6ac4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #run-button:hover:not(:disabled) { background: #4c5ab4; }
    #run-button:active:not(:disabled) { background: #3c4aa4; }
    #run-button:disabled { background: #3d3d3d; color: #888; cursor: not-allowed; }

    #canvas-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border-radius: 4px;
      border: 1px solid #3d3d3d;
    }

    canvas {
      display: block;
      background: #111;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="editor-panel">
    <h1>Aroma Code Editor</h1>
    <select id="example-selector">
      <option value="default.lua">default.lua</option>
      <option value="events.lua">events.lua</option>
      <option value="font.lua">font.lua</option>
      <option value="tetris.lua">tetris.lua</option>
    </select>
    <textarea id="code-editor"></textarea>
    <button id="run-button" disabled>Run Code</button>
  </div>

  <div id="canvas-panel">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
